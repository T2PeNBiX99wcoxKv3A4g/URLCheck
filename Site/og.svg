<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
    <title id="title">URLCheck</title>
    <desc id="desc">Check the URL before it opens in your browser.</desc>

    <defs>
        <radialGradient id="glow-top" cx="18%" cy="-10%" r="75%">
            <stop offset="0" stop-color="#6366f1" stop-opacity="0.4"/>
            <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow-bottom" cx="95%" cy="110%" r="70%">
            <stop offset="0" stop-color="#3b82f6" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="urlcheck-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="0.5" stop-color="#6366f1"/>
            <stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="630" fill="#08070f"/>
    <rect width="1200" height="630" fill="url(#glow-top)"/>
    <rect width="1200" height="630" fill="url(#glow-bottom)"/>

    <rect x="24" y="24" width="1152" height="582" rx="28" fill="none"
          stroke="#a78bfa" stroke-opacity="0.16" stroke-width="2"/>

    <!-- The app mark, scaled from icon.svg. -->
    <g transform="translate(90 205) scale(0.86)">
        <rect width="256" height="256" rx="58" fill="url(#urlcheck-tile)"/>
        <g transform="translate(112.75 112.75) scale(6.8) translate(-12 -12)"
           fill="none" stroke="#ffffff" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </g>
        <circle cx="184.75" cy="184.75" r="33" fill="#ffffff"/>
        <path d="M168.75 184.75l10 10 21-22" fill="none" stroke="url(#urlcheck-tile)" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
        <text x="360" y="306" fill="#f5f3ff" font-size="90" font-weight="700" letter-spacing="-3">URLCheck</text>
        <text x="364" y="374" fill="#a9a2c4" font-size="30">Check the URL before it opens in your browser.</text>
        <text x="364" y="432" fill="#6f6885" font-size="23" letter-spacing="0.4">See where a link really goes.</text>
    </g>

    <text x="1110" y="570" fill="#6f6885" font-family="Cascadia Mono, Consolas, monospace"
          font-size="19" text-anchor="end">t2penbix99wcoxkv3a4g.github.io/URLCheck</text>
</svg>
