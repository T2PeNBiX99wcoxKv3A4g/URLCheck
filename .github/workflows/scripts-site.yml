name: Scripts Site

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "Lua/**"
      - "LuaSite/**"
      - ".github/workflows/scripts-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the page
        working-directory: LuaSite
        run: |
          npm install
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: LuaSite/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
