name: Site

on:
  workflow_dispatch:
  # The docs are generated from the wiki, which lives in its own repository, so a push here cannot
  # notice a wiki edit; the daily run picks those up.
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - master
    paths:
      - "Lua/**"
      - "Site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the site
        working-directory: Site
        run: |
          npm install
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: Site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
