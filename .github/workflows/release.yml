name: Release

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dev/**"
      - "dependabot/**"
      - "maven"
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE*"
      - ".github/workflows/dependabot-auto-merge.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/csharp_release.yml@main
    with:
      project_path: './URLCheck/URLCheck.csproj'
      filename: 'URLCheck'
      runtimes: '["win-x64", "linux-x64"]'
      version_file_path: './URLCheck/URLCheck.csproj'
      msi_script: 'installer/windows/build-msi.ps1'
      rpm_script: 'installer/linux/build-rpm.sh'
    secrets: inherit
