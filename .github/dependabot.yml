# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # The C# backend — URLCheck/URLCheck.csproj
  - package-ecosystem: nuget
    directory: /URLCheck
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The React interface is upgraded by hand (`npm run upgrade`), so Dependabot
  # does not manage it. Without a committed lockfile it could not do npm
  # security updates anyway.

  # The workflow files — .github/workflows/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"
