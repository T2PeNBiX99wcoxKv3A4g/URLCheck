# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # The C# backend — URLCheck/URLCheck.csproj
  - package-ecosystem: nuget
    directory: /URLCheck
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The React interface — URLCheck/UserInterface/package.json
  # No lockfile is committed on purpose, so this only covers direct dependencies.
  # That is fine: npm security updates would need a lockfile, but the lockfile
  # caused more trouble than it was worth here.
  - package-ecosystem: npm
    directory: /URLCheck/UserInterface
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The workflow files — .github/workflows/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"
